name: ci
on: [push, pull_request]

jobs:
  test:
    # engines says >=18, and until 2026-08-12 nothing ever ran it: this job pinned
    # Node 20. orogami declared the same floor, was broken on 18, on 20.18 and on
    # 22.0-22.6, and its single Node 20 job stayed green throughout. The break was
    # not monotonic, so one version cannot stand in for the others.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test

  dogfood:
    # carrylint lints its own portable files. If we ever hardcode a path or an
    # undeclared CLI in our own docs/examples, this fails — same durability bet
    # as reflint/skills-lint self-linting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: carrylint self-check
        run: node src/check.mjs AGENTS.md examples/good

  lint:
    # Correctness rules only, no formatter. biome.jsonc records which rules are off
    # and why: each one is a preference this codebase already applies consistently,
    # so enforcing a different one would be churn rather than improvement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
